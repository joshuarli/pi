name: Build static musl Bun pi

on:
  workflow_dispatch:
    inputs:
      bun_sha:
        description: Full Bun commit SHA whose static musl prerelease asset should be downloaded
        required: true
        default: a9644683f1243a7c22969056be38b616218956e3

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    env:
      BUN_RELEASE_REPOSITORY: joshuarli/bun-musl-static
      BUN_SHA: ${{ inputs.bun_sha }}

    steps:
      - name: Build, smoke-test, and publish the compressed pi-bun artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          work_dir="$RUNNER_TEMP/pi-bun-musl-build"
          compiler_dir="$work_dir/compiler"
          artifact_dir="$work_dir/artifact"
          mkdir -p "$compiler_dir" "$artifact_dir"
          [[ "$BUN_SHA" =~ ^[0-9a-f]{40}$ ]]

          bun_release="bun-${BUN_SHA}-linux-aarch64-musl-static"
          bun_url="https://github.com/${BUN_RELEASE_REPOSITORY}/releases/download/${bun_release}/bun"
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -o "$compiler_dir/bun" \
            "$bun_url"
          chmod 0755 "$compiler_dir/bun"
          bun_sha256="$(sha256sum "$compiler_dir/bun" | awk '{print $1}')"

          cd "$GITHUB_WORKSPACE"
          make bun-linux-arm64-musl \
            BUN_MUSL_URL="$bun_url" \
            BUN_MUSL_SHA256="$bun_sha256" \
            BUN_RUNTIME_SHA="$BUN_SHA" \
            DOCKER_BUILD_CACHE_ARGS='--cache-from type=gha,scope=pi-bun --cache-to type=gha,mode=max,scope=pi-bun' \
            OUT_DIR="$artifact_dir"

          artifact="$(find "$artifact_dir" -maxdepth 1 -type f -name 'pi-*-bun-*-linux-arm64-musl' -print -quit)"
          test -n "$artifact"
          test -x "$artifact"
          file "$artifact"

          release_name="pi-${GITHUB_SHA}-bun-${BUN_SHA}-linux-arm64-musl-static"
          artifact_archive="$artifact.zip"
          (
            cd "$(dirname "$artifact")"
            # -9 is zip's maximum compression level; -X strips host metadata.
            zip -9 -X -q "$artifact_archive" "$(basename "$artifact")"
          )
          unzip -tq "$artifact_archive"
          gh release create "$release_name" \
            "$artifact_archive" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$release_name" \
            --notes "Static ARM64 musl pi-bun built with Bun ${BUN_SHA}." \
            --prerelease
