name: Build static musl Deno

on:
  workflow_dispatch:
    inputs:
      deno_sha:
        description: Full Deno commit SHA whose prerelease archives should be downloaded
        required: true
        default: ae3a64b9ad9e4a9f6341edf537c46245c62b4cfb

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    env:
      DENO_RELEASE_REPOSITORY: joshuarli/deno-musl-static
      DENO_SHA: ${{ inputs.deno_sha }}
      # These checksums are for the pinned Deno release above. Update them
      # together with the workflow input default when moving to another release.
      DENO_COMPILER_SHA256: 5258fae19edc0570506e6cbfa9c0c26a510cd687795ba54129da554607dd9349
      DENO_RUNTIME_SHA256: 0d60fc9495a8b7c25a5eb483cc7052486aaa77a2dd12612488ad8dc489847f2a

    steps:
      - name: Check out the workflow commit
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --depth 1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD

      - name: Build, smoke-test, and publish the compressed release binary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          work_dir="$RUNNER_TEMP/deno-musl-build"
          artifact_dir="$work_dir/artifact"
          mkdir -p "$work_dir" "$artifact_dir"
          compiler_dir="$work_dir/compiler"
          mkdir -p "$compiler_dir"
          [[ "$DENO_SHA" =~ ^[0-9a-f]{40}$ ]]
          deno_release="deno-${DENO_SHA}-linux-aarch64-musl-static"
          release_url="https://github.com/${DENO_RELEASE_REPOSITORY}/releases/download/${deno_release}"

          compiler_archive="$work_dir/deno-quickjs-aarch64-unknown-linux-musl.zip"
          runtime_archive="$work_dir/denort-quickjs-aarch64-unknown-linux-musl.zip"
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -o "$compiler_archive" \
            "$release_url/deno-quickjs-aarch64-unknown-linux-musl.zip"
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -o "$runtime_archive" \
            "$release_url/denort-quickjs-aarch64-unknown-linux-musl.zip"
          echo "$DENO_COMPILER_SHA256  $compiler_archive" | sha256sum --check --status -
          echo "$DENO_RUNTIME_SHA256  $runtime_archive" | sha256sum --check --status -
          unzip -p "$compiler_archive" deno-quickjs-aarch64-unknown-linux-musl > "$compiler_dir/deno"
          unzip -p "$runtime_archive" denort-quickjs-aarch64-unknown-linux-musl > "$compiler_dir/denort"
          chmod 0755 "$compiler_dir/deno" "$compiler_dir/denort"

          docker buildx build --load \
            --cache-from type=gha,scope=pi-deno \
            --cache-to type=gha,mode=max,scope=pi-deno \
            --platform linux/arm64 \
            --build-context deno-bin="$compiler_dir" \
            --build-arg PI_RUNTIME_SHA="$DENO_SHA" \
            --tag "pi-deno:${GITHUB_RUN_ID}" \
            --file Dockerfile.deno .

          container="$(docker create "pi-deno:${GITHUB_RUN_ID}" sh -ec 'apk add --no-cache bash curl >/dev/null && /app/scripts/smoke-test-binary.sh /app/pi-deno deno && /app/scripts/smoke-test-fake-provider.sh /app/pi-deno && mkdir -p /tmp/pi-artifact && cp /app/pi-deno /tmp/pi-artifact/pi-deno')"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker start -a "$container"
          docker cp "$container:/tmp/pi-artifact/pi-deno" "$artifact_dir/pi-deno"
          test -x "$artifact_dir/pi-deno"
          test -z "$(readelf -lW "$artifact_dir/pi-deno" | awk '/INTERP/{print}')"
          test -z "$(readelf -dW "$artifact_dir/pi-deno" | awk '/NEEDED/{print}')"
          file "$artifact_dir/pi-deno"

          artifact_name="pi-${GITHUB_SHA:0:8}-deno-${DENO_SHA:0:8}-linux-arm64-musl-static"
          mv "$artifact_dir/pi-deno" "$artifact_dir/$artifact_name"
          artifact_archive="$artifact_dir/$artifact_name.zip"
          (
            cd "$artifact_dir"
            # -9 is zip's maximum compression level; -X strips host metadata.
            zip -9 -X -q "$(basename "$artifact_archive")" "$artifact_name"
          )
          unzip -tq "$artifact_archive"
          gh release create "$artifact_name" \
            "$artifact_archive" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$artifact_name" \
            --notes "Static ARM64 musl pi-deno built with Deno ${DENO_SHA}." \
            --prerelease
